<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de alunos</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header><p class="tag">MEU PRIMEIRO SISTEMA</p><h1>Cadastro de alunos</h1><p>Da tela ao banco de dados.</p></header>
    <section aria-labelledby="titulo-form"><h2 id="titulo-form">Novo aluno</h2>
      <form id="cadastro">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" required minlength="2" maxlength="80" autocomplete="name">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required maxlength="120" autocomplete="email">
        <label for="curso">Curso</label>
        <input id="curso" name="curso" required minlength="2" maxlength="80">
        <button id="salvar" type="submit">Cadastrar aluno</button>
      </form>
      <p id="mensagem" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="titulo-lista"><h2 id="titulo-lista">Alunos cadastrados</h2>
      <button type="button" id="atualizar">Atualizar lista</button>
      <ul id="lista"></ul>
    </section>
  </main>
</body>
</html>
